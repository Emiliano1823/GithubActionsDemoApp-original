name: Compilar y desplegar

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compilar-desplegar.yml'
      - 'GithubActionsDemoApp/**'
      - 'pruebas/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    env:
      proyecto: GithubActionsDemoApp/GithubActionsDemoApp.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Instalar .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: 8.0.x

      - name: Obteniendo las dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore

      - name: Realizar las pruebas
        run: dotnet test --no-build

      - name: dotnet publish
        run: dotnet publish $proyecto -c Release -o miapp --runtime win-x86

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./miapp
          name: build

      - name: Zip
        run: zip -r mi_app.zip ./miapp
      - name: GH Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./mi_app.zip
          body: "Nuestra aplicación"
          tag_name: ${{ github.ref_name }}





        
